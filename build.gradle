plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.oraclejava'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Frontend (frontend/) build: npm install -> npm run build -> copy dist into static/
def frontendDir = file('frontend')
def npm = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

tasks.register('npmInstall', Exec) {
	group = 'frontend'
	description = 'Installs frontend dependencies.'
	workingDir = frontendDir
	commandLine npm, 'install'
	inputs.files('frontend/package.json', 'frontend/package-lock.json')
	outputs.dir('frontend/node_modules')
}

tasks.register('npmBuild', Exec) {
	group = 'frontend'
	description = 'Builds the frontend into frontend/dist.'
	dependsOn 'npmInstall'
	workingDir = frontendDir
	commandLine npm, 'run', 'build'
	inputs.dir('frontend/src')
	inputs.dir('frontend/public')
	inputs.files('frontend/index.html', 'frontend/package.json', 'frontend/package-lock.json',
			'frontend/vite.config.ts', 'frontend/tsconfig.json', 'frontend/tsconfig.app.json', 'frontend/tsconfig.node.json')
	outputs.dir('frontend/dist')
}

tasks.named('processResources', ProcessResources) {
	// Skip with -PskipFrontend (e.g. when only working on the backend)
	if (!project.hasProperty('skipFrontend')) {
		from(tasks.named('npmBuild')) {
			into 'static'
		}
	}
}
