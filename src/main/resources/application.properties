spring.application.name=demo-boot

# Health check endpoint: GET /actuator/health
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoints.web.base-path=/
management.endpoint.health.show-details=always
management.health.diskspace.enabled=false

# MySQL (override with DB_URL / DB_USERNAME / DB_PASSWORD environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dbdemoboot?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:demoboot}
spring.datasource.password=${DB_PASSWORD:demo1234}

# JPA
spring.jpa.hibernate.ddl-auto=update
# ddl-auto=update는 개발용 설정입니다. 운영 환경에서는 validate로 바꾸고 Flyway 같은 마이그레이션 도구를 쓰는 것을 권장합니다. 
spring.jpa.open-in-view=false
